# Data contract for the `customers` source.
# This drives validation (Iter 3) and governance (Iter 4). It is intentionally
# INCOMPLETE — fill in the TODOs as you build those milestones.
dataset: customers
description: Registered customers.
primary_key: customer_id

columns:
  - name: customer_id
    type: string
    nullable: false
  - name: first_name
    type: string
    nullable: false
    pii: true
    mask: drop            # not needed downstream -> never enters silver (minimisation)
  - name: last_name
    type: string
    nullable: false
    pii: true
    mask: drop
  - name: sa_id_number
    type: string
    nullable: false
    pii: true
    sa_id: true           # 13 digits, real YYMMDD date, Luhn checksum
    mask: tokenise        # how govern.py should hide it in silver
  - name: email
    type: string
    nullable: false
    pii: true
    email: true
    mask: hash
  - name: phone
    type: string
    nullable: true
    pii: true
    phone: true            # +27 then 9 digits
    mask: partial          # keep last 3 digits
  - name: province
    type: string
    nullable: false
    allowed_values: [Eastern Cape, Free State, Gauteng, KwaZulu-Natal, Limpopo,
                     Mpumalanga, North West, Northern Cape, Western Cape]
  - name: signup_date
    type: date
    nullable: false
  - name: home_region
    type: string
    nullable: false
    # the region this person's data is allowed to live in
